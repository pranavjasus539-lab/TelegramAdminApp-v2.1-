name: Build TelegramAdminApp

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------------
      # 2. Find and extract Android project ZIP
      # ---------------------------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Searching for TelegramAdminApp project ZIP"
          echo "=========================================="

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'TelegramAdminApp-v2*.zip' \
            -print -quit)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::TelegramAdminApp-v2*.zip was not found."

            echo ""
            echo "Files found in repository:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          echo "Found project archive:"
          echo "$ZIP"

          echo ""
          echo "Cleaning previous extracted project..."

          rm -rf TelegramAdminApp

          mkdir -p TelegramAdminApp

          echo ""
          echo "Extracting project..."

          # -q = quiet
          # -o = overwrite existing files without asking
          # -d = extract into TelegramAdminApp directory
          unzip -qo "$ZIP" -d TelegramAdminApp

          echo ""
          echo "Checking Android project..."

          if [[ ! -f "TelegramAdminApp/settings.gradle.kts" ]]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          if [[ ! -f "TelegramAdminApp/build.gradle.kts" ]]; then
            echo "::error::build.gradle.kts was not found."
            exit 1
          fi

          if [[ ! -f "TelegramAdminApp/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          echo ""
          echo "Android project extracted successfully."

          echo ""
          echo "Project structure:"
          find TelegramAdminApp -maxdepth 3 -type f | sort


      # ---------------------------------------------------------
      # 3. Set up Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 4. Set up Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ---------------------------------------------------------
      # 5. Install Android SDK packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo ""
          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "Android SDK installation complete."


      # ---------------------------------------------------------
      # 6. Set up Gradle 8.7
      # ---------------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ---------------------------------------------------------
      # 7. Verify Java / Gradle / Android project
      # ---------------------------------------------------------
      - name: Verify build environment
        working-directory: TelegramAdminApp
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Java version"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "Gradle version"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "Android project files"
          echo "=========================================="

          find . -maxdepth 4 -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print | sort

          echo ""
          echo "Build environment verified."


      # ---------------------------------------------------------
      # 8. Run unit tests
      # ---------------------------------------------------------
      - name: Run unit tests
        working-directory: TelegramAdminApp
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Running unit tests"
          echo "=========================================="

          gradle \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

          echo ""
          echo "Unit tests completed successfully."


      # ---------------------------------------------------------
      # 9. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: TelegramAdminApp
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Debug APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo ""
          echo "APK build completed successfully."


      # ---------------------------------------------------------
      # 10. Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "Checking APK"
          echo "=========================================="

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK file is empty."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"
          echo ""

          ls -lh "$APK"

          echo ""
          echo "APK path:"
          echo "$APK"


      # ---------------------------------------------------------
      # 11. Upload APK as GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TelegramAdminApp-debug
          path: TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      # ---------------------------------------------------------
      # 12. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "## ✅ TelegramAdminApp Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gradle:** 8.7" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Java:** 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Android SDK:** 34" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build:** Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests:** Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK:** Uploaded as workflow artifact" >> "$GITHUB_STEP_SUMMARY"
