name: Build TelegramAdminApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          unzip -q TelegramAdminApp-v2-storage-fast.zip
          cd TelegramAdminApp
          ls -la

      - name: Run unit tests
        working-directory: TelegramAdminApp
        run: gradle testDebugUnitTest

      - name: Build APK
        working-directory: TelegramAdminApp
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAdminApp-debug
          path: TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk
