name: Build TelegramAdminApp

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. Install the correct Gradle version
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Extract the actual Android project
      - name: Extract TelegramAdminApp
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'TelegramAdminApp-v2-storage-fast.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::TelegramAdminApp-v2-storage-fast.zip was not found."
            exit 1
          fi

          rm -rf TelegramAdminApp

          unzip -q "$ZIP"

          echo "Checking Android project..."

          test -f TelegramAdminApp/settings.gradle.kts
          test -f TelegramAdminApp/app/build.gradle.kts

          echo "Project extracted successfully."

      # 7. Check the build environment
      - name: Check build environment
        working-directory: TelegramAdminApp
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          sdkmanager --list_installed | head -50

          echo "Project files:"
          ls -la

      # 8. Run unit tests
      - name: Run unit tests
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      # 9. Build APK
      - name: Build Debug APK
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 10. Verify APK exists
      - name: Verify APK
        run: |
          set -euo pipefail

          APK="TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "================================="
          echo "APK BUILD SUCCESSFUL"
          echo "================================="

          ls -lh "$APK"

      # 11. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAdminApp-debug
          path: TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
