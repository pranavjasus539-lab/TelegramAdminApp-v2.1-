name: Build TelegramAdminApp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.7'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Find and extract the Android project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'TelegramAdminApp-v2*.zip' \
            -print -quit)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::TelegramAdminApp ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | sort

          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts

          echo "Android project detected successfully."

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. Android SDK packages
      - name: Install Android SDK
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 6. Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # 7. Verify project
      - name: Verify project
        working-directory: android-project
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "Gradle files:"
          find . -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' \) \
            -print | sort

      # 8. Run tests
      - name: Run unit tests
        working-directory: android-project
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest

      # 9. Build APK
      - name: Build Debug APK
        working-directory: android-project
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      # 10. Verify APK
      - name: Verify APK
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAdminApp-v2.1
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
