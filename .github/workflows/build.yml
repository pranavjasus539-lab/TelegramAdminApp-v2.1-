name: Build TelegramAdminApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Extract the project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name 'TelegramAdminApp-v2*.zip' -print -quit)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::No TelegramAdminApp-v2*.zip project archive was found in the repository."
            echo "Files found:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found project archive: $ZIP"

          rm -rf TelegramAdminApp

          unzip -q "$ZIP"

          test -f TelegramAdminApp/settings.gradle.kts
          test -f TelegramAdminApp/build.gradle.kts
          test -f TelegramAdminApp/app/build.gradle.kts

          echo "Project extracted successfully."

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. Required Android SDK packages
      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 6. Gradle 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 7. Verify environment
      - name: Verify toolchain and project
        working-directory: TelegramAdminApp
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f \
            \( -name '*.gradle' \
            -o -name '*.gradle.kts' \
            -o -name 'gradle-wrapper.properties' \) \
            -print | sort

      # 8. Unit tests
      - name: Run unit tests
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest

      # 9. Build APK
      - name: Build debug APK
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      # 10. Check APK
      - name: Verify APK
        run: |
          set -euo pipefail

          APK="TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TelegramAdminApp-debug
          path: TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
