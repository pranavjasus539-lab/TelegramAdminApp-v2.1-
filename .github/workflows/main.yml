name: Build TelegramAdminApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the Android project FIRST
      - name: Extract TelegramAdminApp
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'TelegramAdminApp-v2-storage-fast.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::TelegramAdminApp-v2-storage-fast.zip was not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf TelegramAdminApp

          unzip -q "$ZIP"

          echo "Checking extracted project..."

          test -f TelegramAdminApp/settings.gradle.kts
          test -f TelegramAdminApp/build.gradle.kts
          test -f TelegramAdminApp/app/build.gradle.kts

          echo "Android project extracted successfully."

      # 3. Install JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 6. Install Gradle 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Check build environment
      - name: Check build environment
        working-directory: TelegramAdminApp
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== PROJECT ====="
          ls -la

      # 8. Run unit tests
      - name: Run unit tests
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      # 9. Build APK
      - name: Build Debug APK
        working-directory: TelegramAdminApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 10. Verify APK
      - name: Verify APK
        run: |
          set -e

          APK="TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK file is empty."
            exit 1
          fi

          echo "======================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAdminApp-debug
          path: TelegramAdminApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
